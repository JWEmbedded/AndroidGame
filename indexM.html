<!DOCTYPE html>
<html>
<head>
    <title>Tetris - Color Shadow Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #202028; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats { font-size: 28px; margin-bottom: 10px; font-weight: bold; }

        canvas { 
            border: solid 4px #444; 
            background-color: #000; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            touch-action: none;
        }

        /* Game Complete Overlay */
        #completeOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            border: 4px solid #0DFF72;
            box-sizing: border-box;
        }
        #completeOverlay.visible {
            display: flex;
        }
        #completeOverlay h2 {
            font-size: 26px;
            color: #0DFF72;
            margin: 0;
            text-align: center;
            text-shadow: 0 0 12px #0DFF72;
            letter-spacing: 2px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 70%;
        }
        .btn-group button {
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            background: #333;
            color: #fff;
            transition: transform 0.1s, background 0.15s, border-color 0.15s;
        }
        .btn-group button:active { transform: scale(0.96); }
        .btn-group button:hover {
            background: #FF0D72;
            border-color: #FF0D72;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="stats">Score: <span id="score">0</span></div>

        <div style="position:relative;">
                <canvas id="tetris" width="240" height="480"></canvas>
                <div id="completeOverlay">
                    <h2>GAME<br>COMPLETE!</h2>
                    <div class="btn-group">
                        <button id="btnNewGame">NEW GAME</button>
                        <button id="btnExit">EXIT</button>
                    </div>
                </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const completeOverlay = document.getElementById('completeOverlay');

        context.scale(24, 24);

        let gameComplete = false;

        // --- 테트리스 로직 ---
        let bag = [];
        function fillBag() {
            const pieces = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
            return pieces;
        }

        function getNextPieceType() {
            if (bag.length === 0) bag = fillBag();
            return bag.pop();
        }

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        const colors = [null,'#FF0D72','#0DC2FF','#0DFF72','#F538FF','#FF8E0D','#FFE138','#3877FF'];
        let arena = Array.from({length: 20}, () => Array(10).fill(0));
        const player = { pos: {x:0, y:0}, matrix: null, score: 0 };

        function getShadowColor(hex, alpha) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x:0, y:0});
            drawShadow(player);
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'white';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function drawShadow(player) {
            const shadowPos = { x: player.pos.x, y: player.pos.y };
            while (!collide(arena, { matrix: player.matrix, pos: shadowPos })) shadowPos.y++;
            shadowPos.y--;
            let colorIndex = 0;
            for (let row of player.matrix) {
                for (let val of row) { if (val !== 0) { colorIndex = val; break; } }
                if (colorIndex !== 0) break;
            }
            const shadowFill = getShadowColor(colors[colorIndex], 0.3);
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = shadowFill;
                        context.fillRect(x + shadowPos.x, y + shadowPos.y, 1, 1);
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y)
                for (let x = 0; x < m[y].length; ++x)
                    if (m[y][x] !== 0 && (arena[y+o.y] && arena[y+o.y][x+o.x]) !== 0) return true;
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function arenaSweep() {
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) { if (arena[y][x] === 0) continue outer; }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += 10;
            }
            if (player.score >= 1000) {
                gameComplete = true;
                completeOverlay.classList.add('visible');
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y)
                for (let x = 0; x < y; ++x)
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            playerDrop();
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerReset() {
            const nextType = getNextPieceType();
            player.matrix = createPiece(nextType);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            canSpace = false;
            setTimeout(() => { canSpace = true; }, 500);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                bag = [];
                updateScore();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function updateScore() { scoreElement.innerText = player.score; }

        let dropCounter = 0;
        let lastTime = 0;
        let isSpacePressed = false;
        let canSpace = true;
        let animFrameId = null;

        function update(time = 0) {
            if (gameComplete) { draw(); return; }
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > 1000) playerDrop();
            draw();
            animFrameId = requestAnimationFrame(update);
        }

        function startNewGame() {
            gameComplete = false;
            completeOverlay.classList.remove('visible');
            arena.forEach(row => row.fill(0));
            player.score = 0;
            bag = [];
            dropCounter = 0;
            lastTime = 0;
            isSpacePressed = false;
            canSpace = true;
            updateScore();
            playerReset();
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(update);
        }

        // --- 키보드 조작 ---
        document.addEventListener('keydown', event => {
            if (gameComplete) return;
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 32) {
                if (!isSpacePressed && canSpace) {
                    isSpacePressed = true;
                    playerHardDrop();
                }
                event.preventDefault();
            }
        });
        document.addEventListener('keyup', event => { if (event.keyCode === 32) isSpacePressed = false; });

        // --- 터치 조작 ---
        // 좌/우: 터치 유지 상태로 드래그 → 블록 1칸 단위 실시간 이동
        // 위 스와이프: 회전 / 아래 스와이프: 하드 드롭
        let touchStartX = 0;
        let touchStartY = 0;
        let touchLastX = 0;
        let touchDirection = null; // 'horizontal' | 'vertical' | null
        const DIRECTION_LOCK = 10;  // 방향 결정 임계값 (px)
        const CELL_PX = 24;         // 캔버스 scale과 동일 (1셀 = 24px)
        let touchAccumX = 0;        // 수평 누적 이동량

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchLastX  = t.clientX;
            touchDirection = null;
            touchAccumX = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (gameComplete) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;

            // 방향이 아직 결정되지 않았으면 임계값 넘는 순간 고정
            if (!touchDirection) {
                if (Math.abs(dx) > DIRECTION_LOCK || Math.abs(dy) > DIRECTION_LOCK) {
                    touchDirection = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
                }
            }

            // 수평 방향: 손가락 위치에 따라 셀 단위로 이동
            if (touchDirection === 'horizontal') {
                touchAccumX += t.clientX - touchLastX;
                const steps = Math.trunc(touchAccumX / CELL_PX);
                if (steps !== 0) {
                    playerMove(steps > 0 ? 1 : -1);
                    touchAccumX -= steps * CELL_PX;
                }
            }

            touchLastX = t.clientX;
        }, { passive: false });

        let lastDownSwipeTime = 0;

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (gameComplete) return;

            // 수직 방향만 touchend에서 처리
            if (touchDirection === 'vertical') {
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (dy < -DIRECTION_LOCK) {
                    playerRotate(1);   // 위 스와이프 → 회전
                } else if (dy > DIRECTION_LOCK) {
                    // 아래 스와이프 두 번 연속(0.6초 이내)이어야 하드 드롭
                    const now = Date.now();
                    if (now - lastDownSwipeTime < 600) {
                        playerHardDrop();
                        lastDownSwipeTime = 0;
                    } else {
                        lastDownSwipeTime = now;
                    }
                }
            }

            touchDirection = null;
            touchAccumX = 0;
        }, { passive: false });

        document.getElementById('btnNewGame').addEventListener('click', startNewGame);
        document.getElementById('btnExit').addEventListener('click', () => window.close());

        playerReset();
        updateScore();
        animFrameId = requestAnimationFrame(update);
    </script>
</body>
</html>
